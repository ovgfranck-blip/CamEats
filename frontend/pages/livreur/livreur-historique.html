<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamEats — Historique</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/livreur.css" />
</head>
<body>

  <header class="livreur-header">
    <a href="livreur-dashboard.html" class="btn-back">← Retour</a>
    <div style="font-size:15px;font-weight:600;">Mes courses</div>
    <div style="width:40px;"></div>
  </header>

  <main class="livreur-main">

    <div class="filter-row">
      <button class="btn-filter active" data-period="today">Aujourd'hui</button>
      <button class="btn-filter" data-period="week">Semaine</button>
      <button class="btn-filter" data-period="month">Mois</button>
    </div>

    <div id="historiqueList">
      <p class="empty-state">Aucune course pour cette période.</p>
    </div>

    <div class="incident-card">
      <div class="incident-label">💬 Un problème avec une course ?</div>
      <button class="btn-incident">Signaler un incident →</button>
    </div>

    <nav class="bottom-nav">
      <a href="livreur-dashboard.html" class="nav-item">
        <span class="nav-icon">🏠</span><span>Accueil</span>
      </a>
      <a href="livreur-map.html" class="nav-item">
        <span class="nav-icon">🗺️</span><span>Carte</span>
      </a>
      <a href="livreur-historique.html" class="nav-item active">
        <span class="nav-icon">📋</span><span>Courses</span>
      </a>
      <a href="livreur-revenus.html" class="nav-item">
        <span class="nav-icon">💰</span><span>Revenus</span>
      </a>
      <a href="livreur-profil.html" class="nav-item">
        <span class="nav-icon">👤</span><span>Profil</span>
      </a>
    </nav>

  </main>

  <script src="../../js/global.js"></script>
  <script src="../../js/livreur.js"></script>
</body>
</html>
