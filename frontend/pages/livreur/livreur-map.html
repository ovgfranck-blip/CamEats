<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamEats — Itinéraire</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/livreur.css" />
</head>
<body>

  <main class="map-main">

    <div class="status-banner" id="statusBanner">
      <span id="statusText">🚗 En route vers le restaurant</span>
    </div>

    <!-- Zone carte -->
    <div class="map-container" id="mapContainer">
      <div class="map-grid-bg"></div>
      <div class="map-route-line"></div>
      <div class="map-pin pin-restaurant">🍽</div>
      <div class="map-pin pin-client">📍</div>
    </div>

    <!-- ETA -->
    <div class="eta-strip">
      <div>
        <div class="eta-val" id="etaVal">— min</div>
        <div class="eta-lbl" id="etaLbl">Calcul en cours…</div>
      </div>
      <button class="btn btn-danger" style="padding:8px 16px;font-size:13px;">Naviguer →</button>
    </div>

    <!-- Infos commande -->
    <div class="map-info">
      <div class="map-info-row">
        <span class="map-info-label">Restaurant</span>
        <span class="map-info-value" id="mapResto">—</span>
      </div>
      <div class="map-info-row">
        <span class="map-info-label">Client</span>
        <span class="map-info-value" id="mapClient">—</span>
      </div>
      <div class="map-info-row">
        <span class="map-info-label">Adresse</span>
        <span class="map-info-value" id="mapAdresse">—</span>
      </div>
    </div>

    <!-- Étapes -->
    <div class="steps-row">
      <div class="step">
        <div class="step-dot done" id="step1">✓</div>
        <div class="step-label">Accepté</div>
      </div>
      <div class="step-line done" id="line1"></div>
      <div class="step">
        <div class="step-dot done" id="step2">✓</div>
        <div class="step-label" id="step2lbl">Récupéré</div>
      </div>
      <div class="step-line pending" id="line2"></div>
      <div class="step">
        <div class="step-dot active" id="step3">3</div>
        <div class="step-label active">Livraison</div>
      </div>
    </div>

    <!-- Boutons d'action -->
    <div style="padding:16px;background:var(--color-dark);">
      <button id="btnRecuperer" class="btn btn-primary btn-full" style="display:none;">
        ✅ J'ai récupéré la commande
      </button>
      <button id="btnLivrer" class="btn btn-success btn-full" style="display:none;">
        📦 Commande livrée !
      </button>
    </div>

  </main>

  <script src="../../js/global.js"></script>
  <script src="../../js/livreur.js"></script>
</body>
</html>
